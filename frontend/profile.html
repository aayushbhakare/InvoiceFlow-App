<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoiceFlow - Complete Your Profile</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="container">
    <h1 class="title">Business Details</h1>
    <p class="subtitle">We need this to generate valid GST invoices.</p>

    <form id="profile-form">
        <div class="field">
            <label>Registered Email</label>
            <input type="email" id="email" placeholder="Loading..." readonly style="background-color: #f1f3f5; cursor: not-allowed; color: var(--gray-6);">
        </div>

        <div class="field">
            <label>Billing Name (Your Name or Company Name)</label>
            <input type="text" id="display_name" placeholder="E.g. Mehta Consulting" required>
            <div class="error-msg" id="err-display_name"></div>
        </div>

        <div class="field">
            <label>Mobile Number</label>
            <input type="text" id="phone_number" placeholder="98765XXXXX" required>
            <div class="error-msg" id="err-phone_number"></div>
        </div>

        <div class="field">
            <label>UPI ID</label>
            <input type="text" id="upi_id" placeholder="name@okbank" required>
            <div class="error-msg" id="err-upi_id"></div>
        </div>

        <div class="field">
            <label>Bank Account Number</label>
            <input type="text" id="account_number" placeholder="Enter Account Number" required>
            <div class="error-msg" id="err-account_number"></div>
        </div>

        <div class="field">
            <label>IFSC Code</label>
            <input type="text" id="ifsc_code" placeholder="SBIN0001234" required>
            <div class="error-msg" id="err-ifsc_code"></div>
        </div>

        <div class="field">
            <label>GSTIN (Optional)</label>
            <input type="text" id="gstin" placeholder="27XXXXX1234X1ZX">
            <div class="error-msg" id="err-gstin"></div>
        </div>

        <div class="field">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="411001" maxlength="6" inputmode="numeric">
            <div class="error-msg" id="err-pincode"></div>
        </div>

        <div class="field">
            <label>Street Address</label>
            <input type="text" id="street_address" placeholder="Office / Shop No, Street">
            <div class="error-msg" id="err-street_address"></div>
        </div>

        <div class="field-row">
            <div class="field">
                <label>City</label>
                <input type="text" id="city" placeholder="City">
                <div class="error-msg" id="err-city"></div>
            </div>
            <div class="field">
                <label>State</label>
                <input type="text" id="state" placeholder="State">
                <div class="error-msg" id="err-state"></div>
            </div>
        </div>

        <h2 class="title" style="margin-top: 32px; font-size: 18px;">Payment Gateway (Optional)</h2>
        <p class="subtitle" style="margin-bottom: 24px;">Enable Razorpay to let clients pay via UPI/Card directly from the invoice.</p>

        <div class="field">
            <label>Razorpay Key ID</label>
            <input type="text" id="razorpay_key_id" placeholder="rzp_test_...">
            <div class="error-msg" id="err-razorpay_key_id"></div>
        </div>

        <div class="field">
            <label>Razorpay Key Secret</label>
            <input type="password" id="razorpay_key_secret" placeholder="Enter Secret Key">
            <div class="error-msg" id="err-razorpay_key_secret"></div>
        </div>

        <button type="submit" id="save-profile-btn" class="submit-btn">Save & Go to Dashboard</button>

        <p class="skip-text" id="skip-wrapper">
            <a href="dynamicdashboard.html" id="skip-profile-btn">Skip for now, I'll complete this later</a>
        </p>

    </form>
</div>

<div class="container danger-zone">
    <h2 class="title" style="color: var(--red-text);">Danger Zone</h2>
    <p class="subtitle">Once you delete your account, there is no going back. Please be certain.</p>
    <button class="btn-danger" onclick="deleteAccount()">Delete My Account</button>
</div>

<div id="toast-el" class="toast"></div>

<script src="utils.js"></script>
<script src="profile.js"></script>
</body>
</html>
