<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Invoice — InvoiceFlow</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="createinvoice.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo"><span class="logo-dot"></span> InvoiceFlow</div>
    <div class="breadcrumb"><i class="ti ti-chevron-right"></i><span>New Invoice</span></div>
  </div>
  <div class="topbar-actions">
    <button class="btn-primary" onclick="saveAndSendInvoice()" style="margin:0; padding: 8px 16px;"><i class="ti ti-send"></i> Save & Send</button>
  </div>
</div>

<div class="page">
  <div class="page-header">
    <div class="page-title">New Invoice</div>
    <div class="page-sub">Create and send a professional invoice to your client</div>
  </div>

  <div class="grid">
    <div>
      <div class="section">
        <div class="section-title">Invoice details</div>
        <div class="row row-2">
          <div class="field"><label>Issue date</label><input type="date" id="issue-date" onchange="updateSummary()" /></div>
          <div class="field"><label>Due date</label><input type="date" id="due-date" /></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Bill to</div>
        <div class="field">
          <label>Select client</label>
          <select id="client-select" onchange="loadClient()">
            <option value="">— Loading clients... —</option>
          </select>
        </div>
        <div class="client-preview" id="client-preview">
          <div class="cp-name" id="cp-name"></div>
          <div class="cp-detail" id="cp-detail"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Services / Line items</div>
        <div class="services-head" style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 40px; gap: 10px; font-weight: 500; color: var(--gray-6); margin-bottom: 8px;">
            <span>LineItems</span>
            <span style="text-align:right">Rate (₹)</span>
            <span style="text-align:right">Hours/Qty</span>
            <span style="text-align:right">Amount</span>
            <span></span>
        </div>
        <div id="service-rows"></div>
        <button class="add-row-btn" onclick="addRow()"><i class="ti ti-plus"></i> Add service</button>
        
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px; border-top:1px solid var(--border); padding-top:10px;">
          <label style="margin-top:8px">Discount %</label>
          <input type="number" id="discount-val" value="0" oninput="recalc()" style="width:80px; text-align:right" />
        </div>
      </div>

      <div class="section">
        <div class="section-title">Tax & Notes</div>
        <div class="row row-2">
          <div class="field">
            <label>GST rate</label>
            <select id="gst-rate" onchange="recalc()">
              <option value="0">0%</option>
              <option value="18" selected>18%</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Notes / Payment instructions</label><textarea id="notes"></textarea></div>
      </div>
    </div>

    <div>
      <div class="summary-card">
        <div class="section-title">Invoice summary</div>
        <div class="sum-row"><span class="sum-label">Subtotal</span><span id="s-sub">₹0</span></div>
        <div class="sum-row" style="color:var(--teal-dark)"><span class="sum-label">Discount</span><span id="s-discount">₹0</span></div>
        <div class="sum-row"><span class="sum-label">GST</span><span id="s-gst">₹0</span></div>
        
        <div class="sum-indent" id="cgst-row" style="display:none"><span>CGST 9%</span><span id="s-cgst">₹0</span></div>
        <div class="sum-indent" id="sgst-row" style="display:none"><span>SGST 9%</span><span id="s-sgst">₹0</span></div>
        <div class="sum-indent" id="igst-row" style="display:none"><span>IGST 18%</span><span id="s-igst">₹0</span></div>

        <div class="total-block"><span>Total due</span><span id="s-total">₹0</span></div>
        <div class="recurring-section" style="margin: 16px 0; padding: 16px; background: #f8faf9; border-radius: 10px; border: 1px solid #e5e7eb;">
            
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="font-weight:600; font-size:13px; color:var(--text-primary);">Recurring Invoice</div>
                <label style="position:relative; display:inline-block; width:40px; height:20px; cursor:pointer; margin:0;">
                    <input type="checkbox" id="is-recurring" onchange="toggleRecurring()" style="opacity:0; width:0; height:0; position:absolute; appearance:none;">
                    <span id="toggle-track" style="position:absolute; top:0; left:0; right:0; bottom:0; background:#ccc; border-radius:20px; transition:.3s;"></span>
                    <span id="toggle-dot" style="position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.3s;"></span>
                </label>
            </div>

            <div id="recurring-options" style="display:none; margin-top:14px;">

                <div style="display:flex; gap:10px; margin-bottom:14px;">
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:4px;">Frequency</label>
                        <select id="recurring-freq" style="width:100%; padding:7px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:white; appearance:auto; -webkit-appearance:auto;">
                            <option value="WEEKLY">Weekly</option>
                            <option value="MONTHLY" selected>Monthly</option>
                            <option value="QUARTERLY">Quarterly</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:11px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:4px;">Start Date</label>
                        <input type="date" id="recurring-start" style="width:100%; padding:7px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; box-sizing:border-box;">
                    </div>
                </div>

                <label style="font-size:11px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Stops after</label>
                
                <div style="display:flex; flex-direction:column; gap:10px; font-size:12px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-primary); margin:0; font-weight:normal;">
                    
                        <input type="radio" name="recurring-end" value="occurrences" checked onchange="toggleEndType()" style="width:14px; height:14px; margin:0; padding:0; appearance:radio; -webkit-appearance:radio; background:none; border:none;">
                        <span>After</span>
                        <input type="number" id="recurring-occurrences" value="6" min="1" max="52" style="width:48px; padding:4px; border:1px solid var(--border); border-radius:4px; text-align:center; font-size:12px;">
                        <span>times</span>
                    </label>
                    
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-primary); margin:0; font-weight:normal;">
                        <input type="radio" name="recurring-end" value="end_date" onchange="toggleEndType()" style="width:14px; height:14px; margin:0; padding:0; appearance:radio; -webkit-appearance:radio; background:none; border:none;">
                        <span>Until</span>
                        <input type="date" id="recurring-end-date" disabled style="padding:4px; border:1px solid var(--border); border-radius:4px; font-size:12px; flex:1;">
                    </label>
                    
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-primary); margin:0; font-weight:normal;">
                        <input type="radio" name="recurring-end" value="forever" onchange="toggleEndType()" style="width:14px; height:14px; margin:0; padding:0; appearance:radio; -webkit-appearance:radio; background:none; border:none;">
                        <span>Repeat forever</span>
                    </label>
                </div>
            </div>
        </div>

        <button class="btn-primary" onclick="saveInvoice()"><i class="ti ti-check"></i> Save Invoice</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="createinvoice.js"></script>

</body>
</html>
