<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoiceFlow - Reset Password</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0D0D0B; --gray-9: #1C1C1A; --gray-8: #333333; --gray-6: #6B6A66;
  --gray-2: #E8E6E0; --white: #FAFAF8; --teal: #1D9E75; --font: 'Geist', sans-serif;
}
body {
  font-family: var(--font); background: var(--white); color: var(--black);
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
}
.toast {
  position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
  background: var(--black); color: var(--white); padding: 12px 24px;
  border-radius: 10px; font-size: 14px; font-weight: 500;
  transition: all 0.3s ease; opacity: 0; z-index: 1000;
}
.toast.show { bottom: 24px; opacity: 1; }
.card {
  background: var(--white); width: 100%; max-width: 400px;
  padding: 40px; border-radius: 16px; border: 1px solid var(--gray-2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;
}
.card h2 { font-size: 24px; margin-bottom: 8px; font-weight: 600; }
.card p { font-size: 14px; color: var(--gray-6); margin-bottom: 24px; }
.field { text-align: left; margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.field input {
  width: 100%; padding: 12px 14px; font-family: var(--font); font-size: 14px;
  border: 1px solid var(--gray-2); border-radius: 8px; outline: none;
}
.field input:focus { border-color: var(--black); }
.submit-btn {
  width: 100%; background: var(--black); color: var(--white); border: none;
  padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: background 0.2s; margin-top: 8px;
}
.submit-btn:hover { background: var(--gray-8); }
.submit-btn:disabled { background: var(--gray-6); cursor: not-allowed; }
</style>
</head>
<body>

<div class="card">
    <h2>Set New Password</h2>
    <p>Please enter your new password below.</p>
    <form id="reset-password-form">
        <div class="field">
            <label>New Password</label>
            <input type="password" id="new-password" placeholder="Min. 8 characters" required>
        </div>
        <div class="field">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm new password" required>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Reset Password</button>
    </form>
</div>

<div id="toast-el" class="toast"></div>

<script src="utils.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
