<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Invoice — InvoiceFlow</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; max-width: 420px; width: 100%; text-align: center; }
        .logo { font-size: 18px; font-weight: 600; margin-bottom: 24px; }
        .logo-dot { display: inline-block; width: 8px; height: 8px; background: #1D9E75; border-radius: 50%; margin-right: 4px; }
        .inv-num { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
        .amount { font-size: 36px; font-weight: 700; margin: 16px 0; }
        .client { font-size: 14px; color: #374151; margin-bottom: 24px; }
        .pay-btn { width: 100%; padding: 14px; background: #1D9E75; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .pay-btn:hover { background: #178a65; }
        .pay-btn:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 14px; color: #6b7280; }
        .success { color: #1D9E75; font-weight: 600; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><span class="logo-dot"></span>InvoiceFlow</div>
        <div class="inv-num" id="inv-num">Loading...</div>
        <div class="amount" id="amount"></div>
        <div class="client" id="client"></div>
        <button class="pay-btn" id="pay-btn" onclick="startPayment()" disabled>Pay Now</button>
        <div class="status" id="status"></div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="pay.js"></script>
</body>
</html>
