<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Service — InvoiceFlow</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="createclient.css">
</head>
<body style="background: transparent; padding: 0;">

<div class="card" style="margin: 0; border: none; border-radius: 0; box-shadow: none; width: 100%; max-width: 100%;">
  <div class="card-header">
    <div class="card-header-left">
      <div class="header-icon">
        <i class="ti ti-briefcase"></i>
      </div>
      <div>
        <div class="card-title">Add new service</div>
        <div class="card-sub">Create a standard catalog item for invoices</div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="row col1">
      <div class="field" id="f-name">
        <label>Service name <span class="req">*</span></label>
        <input type="text" id="service-name" placeholder="e.g. Web Development" oninput="chk('f-name', this.value)">
        <span class="err">Service name is required</span>
      </div>
    </div>

    <div class="row col1">
      <div class="field" id="f-desc">
        <label>Description (Optional)</label>
        <input type="text" id="service-desc" placeholder="Brief details about the service">
      </div>
    </div>

    <div class="row col1">
      <div class="field" id="f-rate">
        <label>Default Rate (₹) <span class="req">*</span></label>
        <input type="number" id="service-rate" placeholder="e.g. 1500" min="0" oninput="chk('f-rate', this.value)">
        <span class="err">Valid rate is required</span>
      </div>
    </div>
  </div>

  <div class="card-footer">
    <p class="required-note"><span>*</span> Required fields</p>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeIframe()">Cancel</button>
      <button class="btn-save" onclick="submitService()">
        <i class="ti ti-device-floppy"></i>
        Save 
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <i class="ti ti-circle-check"></i>
  <span id="toast-msg"></span>
</div>

<script src="utils.js"></script>
<script src="createservice.js"></script>
</body>
</html>
